<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Suporte TI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ed 100%);
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 50, 0.25);
            padding: 2.5rem 2rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .icon {
            background: #1a5cff;
            color: #fff;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }
        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b1a33;
        }
        .login-header p {
            color: #4a637f;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f334a;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #dce3ec;
            border-radius: 12px;
            font-size: 1rem;
            background: #fafcff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #1a5cff;
            box-shadow: 0 0 0 4px rgba(26, 92, 255, 0.12);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: #1a5cff;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .btn-login:hover {
            background: #0f4ad6;
            box-shadow: 0 8px 20px -6px rgba(26, 92, 255, 0.4);
        }
        .error-msg {
            color: #d1453b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-align: center;
            min-height: 1.5rem;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0b1a33;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="icon"><i class="fas fa-user-cog"></i></div>
            <h1>Suporte TI</h1>
            <p>Entre com suas credenciais</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" required />
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required />
            </div>
            <div id="errorMsg" class="error-msg"></div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-exclamation-circle" style="color:#ffb347;"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        (function() {
            if (!localStorage.getItem('users')) {
                const defaultUsers = [
                    { username: 'admin', password: 'admin', role: 'admin' },
                    { username: 'user', password: 'user', role: 'user' }
                ];
                localStorage.setItem('users', JSON.stringify(defaultUsers));
            }

            const form = document.getElementById('loginForm');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            function showToast(msg) {
                toastMessage.textContent = msg;
                toast.classList.add('show');
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorMsg.textContent = '';

                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const found = users.find(u => u.username === username.value.trim() && u.password === password.value
                    .trim());

                if (!found) {
                    errorMsg.textContent = 'Usuário ou senha inválidos!';
                    showToast('Credenciais incorretas');
                    return;
                }

                sessionStorage.setItem('loggedUser', JSON.stringify({ username: found.username, role: found.role }));

                if (found.role === 'admin') {
                    window.location.href = 'resolver_chamados.html';
                } else {
                    window.location.href = 'abrir_chamado.html';
                }
            });
        })();
    </script>

</body>
</html>
